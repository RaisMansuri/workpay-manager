<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:12px;padding:40px;">
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <img src="https://nqnyhqkwskvkstpqjvkv.supabase.co/storage/v1/object/public/assets/logo.png"
                   alt="Logo" width="56" height="56"
                   style="display:block;border-radius:16px;" />
            </td>
          </tr>
          <tr>
            <td align="center">
              <h2 style="margin:0 0 12px;color:#111827;font-size:22px;">Reset your password</h2>
              <p style="margin:0 0 24px;color:#6b7280;font-size:15px;line-height:1.5;">
                We received a request to reset your password.
                Click the button below to set a new one.
              </p>
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background:#3452e8;color:#ffffff;
                        text-decoration:none;padding:14px 32px;border-radius:8px;
                        font-weight:bold;font-size:15px;">
                Reset Password
              </a>
              <p style="margin:28px 0 0;color:#9ca3af;font-size:13px;line-height:1.5;">
                If you didn't request this, you can safely ignore this email.
                This link will expire in 1 hour.
              </p>
            </td>
          </tr>
        </table>
        <p style="color:#9ca3af;font-size:12px;margin-top:20px;">
          © 2026 Your App. All rights reserved.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
